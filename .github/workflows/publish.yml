name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:


jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl --with "pytest" python -m pytest

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz --with "pytest" python -m pytest

      - name: Publish
        run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
